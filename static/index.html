<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Terminal">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <title>Terminal</title>
    <link rel="stylesheet" href="/vendor/xterm.css">
    <link rel="stylesheet" href="/terminal.css?v=11">
</head>
<body>
    <div id="terminal"></div>
    <div id="key-bar">
        <button data-key="sessions" id="btn-sessions">&#9776;</button>
        <button data-key="history" id="btn-history" aria-label="History: scroll back through this session" title="History">History</button>
        <button data-key="PageUp" class="scroll-key" aria-label="Page up" title="Page up">&#8670;</button>
        <button data-key="PageDown" class="scroll-key" aria-label="Page down" title="Page down">&#8671;</button>
        <button data-key="ScrollTop" class="scroll-key" aria-label="Scroll to top" title="Scroll to top">&#10514;</button>
        <button data-key="ScrollBottom" class="scroll-key" aria-label="Scroll to latest" title="Scroll to latest">&#10515;</button>
        <button data-key="Escape">Esc</button>
        <button data-key="ctrl" id="btn-ctrl">Ctrl</button>
        <button data-key="Tab">Tab</button>
        <button data-key="|">|</button>
        <button data-key="~">~</button>
        <button data-key="-">-</button>
        <button data-key="ArrowUp">&uarr;</button>
        <button data-key="ArrowDown">&darr;</button>
        <button data-key="ArrowLeft">&larr;</button>
        <button data-key="ArrowRight">&rarr;</button>
    </div>
    <div id="session-picker" class="hidden">
        <div id="session-picker-inner">
            <h2>tmux sessions</h2>
            <div id="session-list"></div>
            <div id="new-session">
                <input type="text" id="new-session-name" placeholder="New session name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                <button id="new-session-btn">Create</button>
            </div>
            <p id="new-session-msg" role="alert" hidden></p>
        </div>
    </div>
    <div id="history" class="hidden" role="dialog" aria-label="Session history">
        <div id="history-bar">
            <span id="history-title"></span>
            <button id="history-top" aria-label="Go to the oldest line">Top</button>
            <button id="history-bottom" aria-label="Go to the newest line">End</button>
            <button id="history-refresh">Refresh</button>
            <button id="history-close">Close</button>
        </div>
        <div id="history-scroll"><pre id="history-text"></pre></div>
    </div>
    <div id="confirm-dialog" class="hidden">
        <div id="confirm-inner">
            <p id="confirm-msg"></p>
            <div id="confirm-buttons">
                <button id="confirm-no">Cancel</button>
                <button id="confirm-yes">Kill</button>
            </div>
        </div>
    </div>
    <div id="overlay" class="hidden">
        <span id="overlay-text">Reconnecting...</span>
    </div>
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/vendor/addon-web-links.js"></script>
    <script src="/vendor/addon-webgl.js"></script>
    <script src="/scroll-engine.js"></script>
    <script src="/close-action.js"></script>
    <script src="/session-link.js?v=3"></script>
    <script src="/history-view.js?v=1"></script>
    <script src="/terminal.js?v=18"></script>
</body>
</html>
